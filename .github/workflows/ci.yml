name: CI

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"]
        python: ["3.15"]

    name: "Python ${{ matrix.python }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all, necessary to find tags and branches
          fetch-tags: true

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Run nox
        run: uv run --extra dev nox -db uv --python ${{ matrix.python }} -s "tests_reverse_dependencies-3.15(package_name='graphix-qasm-parser')"
